name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils m4

      - name: Build compiler
        run: |
          cd bin
          ./make.sh
      - name: Run tests
        run: ./run_tests.sh
      - name: Check freestanding link
        run: |
          printf 'fun main() -> i32 {\n  return 42;\n}\n' > ci_free.pr
          ./bin/driver.sh --freestanding -o ci_free.elf ci_free.pr
          readelf -h ci_free.elf
          readelf -d ci_free.elf 2>&1 | tee dyn.txt
          if grep -q "Dynamic section" dyn.txt; then
            echo "error: freestanding binary has a dynamic section"
            exit 1
          fi